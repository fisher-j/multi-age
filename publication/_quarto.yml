project:
  type: website
  output-dir: ../docs/publication
  pre-render:
    - cmd.exe /c "..\analysis\scripts\sync_zotero_library.bat"
  render:
    - index.qmd
    - manuscript.qmd
    - content-plan.qmd
    - editorial-log.qmd
    - figure-table-plan.qmd
    - compression-map.qmd
    - fuel-analysis-specification.qmd

execute:
  freeze: auto

# The complete Zotero export is synchronized and versioned in analysis/.
# Publication rendering uses that repository snapshot without maintaining a
# second bibliography copy.
bibliography: ../analysis/zotero_library.json
csl: ../analysis/apa.csl

format:
  html:
    toc: true
    toc-depth: 3

website:
  title: Publication manuscript development
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: manuscript.qmd
        text: Manuscript structure
      - href: content-plan.qmd
        text: Content plan
      - href: editorial-log.qmd
        text: Editorial log
      - href: figure-table-plan.qmd
        text: Figures and tables
      - href: compression-map.qmd
        text: Compression map
      - href: fuel-analysis-specification.qmd
        text: Fuel analysis plan
