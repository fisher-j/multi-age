project:
  type: website
  output-dir: ../docs/publication
  pre-render:
    - python scripts/prepare-workflow.py
    - cmd.exe /c "..\analysis\scripts\sync_zotero_library.bat"
  resources:
    - repo-files/**
  render:
    - index.qmd
    - workflow.qmd
    - pipeline-fuel.qmd
    - task-list.qmd
    - task-*.qmd
    - manuscript.qmd
    - manuscript-full.qmd
    - draft-*.qmd

execute:
  # Display chunks read saved tables, not analytical fits. Refresh their values
  # when upstream output changes, even if the prose has not changed.
  freeze: false

bibliography: ../analysis/zotero_library.json
csl: ../analysis/apa.csl

format:
  html:
    toc: true
    toc-depth: 3

website:
  title: Publication manuscript development
  navbar:
    left:
      - href: workflow.qmd
        text: Development workflow
      - href: manuscript.qmd
        text: Manuscript draft
  sidebar:
    - id: workflow
      title: Development workflow
      style: docked
      collapse-level: 1
      contents:
        - href: workflow.qmd
          text: Overview
        - href: pipeline-fuel.qmd
          text: Fuel pipeline map
        - href: task-list.qmd
          text: Task register and task list
        - section: Dedicated task pages
          contents:
            - href: task-f01.qmd
              text: "F01 — fuel-component separation and model exploration"
            - href: task-rd04.qmd
              text: "RD04 — fuel phase and PCT display"
            - href: task-rd02.qmd
              text: "RD02 — regeneration basal-area/density display"
            - href: task-rd03.qmd
              text: "RD03 — sprout-height display"
            - href: task-rt01.qmd
              text: "RT01 — regeneration Results narrative"
            - href: task-rt02.qmd
              text: "RT02 — sprout-height Results narrative"
            - href: task-rt03.qmd
              text: "RT03 — fuel Results narrative"
            - href: task-md01.qmd
              text: "MD01 — study design display"
            - href: task-m01.qmd
              text: "M01 — study area and experimental design"
            - href: task-m02.qmd
              text: "M02 — regeneration and sprout methods"
            - href: task-m03.qmd
              text: "M03 — fuel methods and estimand"
            - href: task-d01.qmd
