format:
  html:
    toc-depth: 4
  docx:
    reference-doc: ../thesis_submission/cnrs_heading_template_2025_0.docx
    toc: true
    toc-depth: 4
    lot: true
    lof: true
  pdf:
    toc: true
    toc-depth: 4

project:
  pre-render:
    - cmd.exe /c "scripts\sync_zotero_library.bat"
    - cp thesis/_index.qmd index.qmd
  output-dir: ../docs
  type: book

book:
  title: >
    Regeneration and fuel loading with varying overstory retention in redwood
    stands 10 years after transformation to multiaged management
  author: Judson Fisher
  date: May 2026
  date-format: long
  output-file: jf-thesis
  downloads: docx
  chapters:
    - index.qmd
    - thesis/introduction.qmd
    - thesis/methods.qmd
    - thesis/results.qmd
    - thesis/discussion.qmd 
  appendices:
    - thesis/tables.qmd
  sidebar:
    contents:
      - text: "Download docx"
        href: "jf-thesis.docx"

comments: 
  hypothesis: true
